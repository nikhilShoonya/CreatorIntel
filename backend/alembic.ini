# Alembic configuration. The database URL comes from backend/.env (DATABASE_URL) via app settings.
# Migrations run automatically when the backend starts; manual use:
#   alembic upgrade head        (apply)
#   alembic revision --autogenerate -m "describe change"   (after editing models)
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
